# Netlify: build the static app and serve it as a single-page app.
# Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY in the Netlify
# site's environment variables (Site configuration → Environment variables).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Links like /goats/123 load the app, which then shows the right page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every response. The Content Security Policy lets the
# page run only its own scripts and talk only to this Supabase project (data,
# sign-in, photos) and the Iconify API (icons), so an injected script couldn't
# load code from elsewhere or send data to another server. If the Supabase
# project ever changes, update its address here too.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://dofoputbvkufewcglkop.supabase.co; connect-src 'self' https://dofoputbvkufewcglkop.supabase.co wss://dofoputbvkufewcglkop.supabase.co https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# The page and service worker must always be fresh, or phones keep running
# an old version after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Built files have a content hash in their names, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
